version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: casino-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - solana-validator
    networks:
      - casino-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: casino-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - casino-net

  solana-validator:
    image: solanalabs/solana:latest
    container_name: solana-local-validator
    command: |
      solana-test-validator
      --reset
      --limit-ledger-size
      --rpc-port 8899
    ports:
      - "8899:8899"
    networks:
      - casino-net

networks:
  casino-net:
    driver: bridge
